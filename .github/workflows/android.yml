name: Android ARM64 debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/desert-strike-android]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          command -v sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Validate source utilities and core-independent native code
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror app/src/main/cpp/tests/test_native.cpp -o /tmp/desert-native-tests
          /tmp/desert-native-tests
          bash scripts/test_jni_integration.sh
          if command -v kotlinc >/dev/null 2>&1; then
            kotlinc app/src/main/java/br/com/desertstrike/IpsPatcher.kt tests/TestIps.kt -include-runtime -d /tmp/test-ips.jar
            java -jar /tmp/test-ips.jar
          fi
      - name: Compile the Snes9x Libretro core for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/snes9xgit/snes9x.git /tmp/snes9x
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C /tmp/snes9x/libretro -j2 platform=unix-arm64 \
            CC="$NDK/aarch64-linux-android26-clang" \
            CXX="$NDK/aarch64-linux-android26-clang++" \
            AR="$NDK/llvm-ar" \
            LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/snes9x/libretro/snes9x_libretro.so app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro.so
          git -C /tmp/snes9x rev-parse HEAD > SNES9X_COMMIT.txt
          python3 scripts/check_elf_16k.py app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Validate APK and copy artifacts
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          python3 scripts/check_elf_16k.py "$APK"
          mkdir -p dist
          cp "$APK" dist/DesertStrike-v0.11-debug.apk
          cp SNES9X_COMMIT.txt dist/
          (cd dist && sha256sum DesertStrike-v0.11-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: DesertStrike-v0.11-debug-APK
          path: dist/
          if-no-files-found: error
